name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Add Capacitor (not saved to package.json)
        run: npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Build the web app (static, no server)
        run: npm run build:android

      - name: Create and sync the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dairy-farmers-hub-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
